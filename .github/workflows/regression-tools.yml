name: Regression tools

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Makefile"
      - "scripts/tests/*dragonball*"
      - "scripts/harbor/**"
      - ".gitignore"
      - "**/.env"
      - "**/.env.*"
      - ".github/workflows/regression-tools.yml"
  push:
    paths:
      - "Makefile"
      - "scripts/tests/*dragonball*"
      - "scripts/harbor/**"
      - ".gitignore"
      - "**/.env"
      - "**/.env.*"
      - ".github/workflows/regression-tools.yml"

permissions:
  contents: read

concurrency:
  group: regression-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check fixture prerequisites
        run: |
          test "$(id -u)" != 0
          for tool in make git cc debugfs ip nsenter unshare bash python3; do
            command -v "$tool"
          done
      - name: Test regression receipts and process cleanup
        run: |
          make test-regression-tools test-hypervisor-tools

  harbor-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install frozen Harbor test dependencies
        run: python -m pip install -r scripts/harbor/requirements-test.txt
      - name: Test Harbor driver without root or VMs
        run: |
          test "$(id -u)" != 0
          for tool in bash tar sha256sum; do
            command -v "$tool"
          done
          make test-harbor-tools REGRESSION_PYTHON=python
