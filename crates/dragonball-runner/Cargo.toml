[package]
name = "agentenv-dragonball-runner"
version.workspace = true
edition = "2021"
license = "MIT"

[[bin]]
name = "aenv-dragonball"
path = "src/main.rs"

[dependencies]
anyhow = "1"
agentenv-vmm-protocol = { path = "../vmm-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
crossbeam-channel = "0.5"
seccompiler = "0.5"
vmm-sys-util = "0.15"
dragonball = { git = "https://github.com/denverdino/kata-containers.git", rev = "bc7edb0faf6e109c013a0659dde0c7a502a5f297", default-features = false, features = ["virtio-blk", "virtio-net", "virtio-balloon"] }
