# Candidate bundle template. Packaging substitutes the qualified tools version.
# All component paths are relative to this config, not the process cwd.
# Set AENV_HOME_PATH / AENV_RUNTIME_PATH / AENV_DEPS_PATH for isolated deployment.
home_path = "../state"
runtime_path = "../run"
deps_path = "../deps"
virtualization_mode = "kvm"

[dragonball]
binary_path = "../bin/aenv-dragonball"

[kernel]
version = "@KERNEL_VERSION@"
image_path = "../assets/vmlinux.bin"

[tools]
version = "@TOOLS_VERSION@"
drive_path = "../assets/tools.ext4"

[ublk]
daemon_binary_path = "../bin/uvm-ublk-daemon"
daemon_metrics_listen_addr = ""
